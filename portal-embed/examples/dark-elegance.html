<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal — Dark Elegance</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ===========================================================
     * DARK ELEGANCE — Dunkles Premium-Portal
     * ===========================================================
     * Farbschema: Dunkel #0f172a mit Cyan-Akzent #22d3ee
     * Inspiriert von: High-End Technologie, Automotive, Luxus
     */
    :root {
      --pe-primary: #22d3ee;
      --pe-primary-text: #0f172a;
      --pe-dark: #f1f5f9;
      --pe-surface: #1e293b;
      --pe-border: #334155;
      --pe-text: #cbd5e1;
      --pe-text-muted: #64748b;
      --pe-radius: 12px;
      --pe-font: 'DM Sans', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--pe-font);
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .de-header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--pe-border);
    }
    .de-header__logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.125rem; color: #f1f5f9;
      text-decoration: none;
    }
    .de-header__logo-glyph {
      width: 36px; height: 36px;
      border: 2px solid var(--pe-primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.875rem; font-weight: 700; color: var(--pe-primary);
    }
    .de-header__links {
      display: flex; gap: 20px; font-size: 0.8125rem;
    }
    .de-header__links a { color: #94a3b8; text-decoration: none; }
    .de-header__links a:hover { color: var(--pe-primary); }

    .de-hero {
      padding: 80px 32px 64px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* Glow effect */
    .de-hero::before {
      content: '';
      position: absolute;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .de-hero__inner {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* Branding overrides for dark bg */
    .de-hero .pe-branding__subtitle { color: var(--pe-primary); }
    .de-hero .pe-branding__title { color: #f1f5f9; font-size: 2.25rem; }
    .de-hero .pe-branding__desc { color: #94a3b8; }
    .de-hero .pe-branding__features li { color: #cbd5e1; }
    .de-hero .pe-branding__check { background: rgba(34, 211, 238, 0.2); }
    .de-hero .pe-branding__check svg { stroke: var(--pe-primary); }

    .de-features {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 0 32px 48px;
      border-bottom: 1px solid var(--pe-border);
    }
    .de-feature {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8125rem; color: #94a3b8;
    }
    .de-feature svg {
      width: 18px; height: 18px; fill: none; stroke: var(--pe-primary);
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .de-content {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 32px;
    }
    .de-content__card {
      background: var(--pe-surface);
      border: 1px solid var(--pe-border);
      border-radius: var(--pe-radius);
      padding: 28px;
    }

    /* Override widget colors for dark theme */
    .de-content .pe-country__title { color: #f1f5f9; }
    .de-content .pe-country__input {
      background: #0f172a; border-color: var(--pe-border); color: #e2e8f0;
    }
    .de-content .pe-country__input::placeholder { color: #475569; }
    .de-content .pe-country__item {
      background: #0f172a; border-color: var(--pe-border); color: #e2e8f0;
    }
    .de-content .pe-country__item:hover {
      border-color: var(--pe-primary); background: #1e293b;
    }
    .de-content .pe-country__item--active {
      border-color: var(--pe-primary); background: rgba(34, 211, 238, 0.1);
    }
    .de-content .pe-country__name { color: #e2e8f0; }
    .de-content .pe-country__count { background: #334155; color: #94a3b8; }

    .de-content .pe-submit {
      background: var(--pe-primary); color: #0f172a; font-weight: 700;
    }
    .de-content .pe-submit--disabled { background: #334155; color: #64748b; }

    .de-content__submit { margin-top: 20px; }

    .de-footer {
      margin-top: auto;
      border-top: 1px solid var(--pe-border);
      padding: 20px 32px;
      text-align: center;
      font-size: 0.75rem;
      color: #475569;
    }
    .de-footer a { color: #64748b; text-decoration: none; }

    @media (max-width: 640px) {
      .de-hero { padding: 48px 16px 40px; }
      .de-hero .pe-branding__title { font-size: 1.5rem; }
      .de-features { flex-direction: column; align-items: center; gap: 12px; padding: 0 16px 32px; }
      .de-content { padding: 32px 16px; }
      .de-content__card { padding: 20px; }
    }
  </style>
</head>
<body>

  <header class="de-header">
    <a href="#" class="de-header__logo">
      <div class="de-header__logo-glyph">P</div>
      <span>Ihr Firmenname</span>
    </a>
    <nav class="de-header__links">
      <a href="#">Support</a>
      <a href="#">Kontakt</a>
    </nav>
  </header>

  <section class="de-hero">
    <div class="de-hero__inner">
      <div data-portal="branding"></div>
    </div>
  </section>

  <div class="de-features">
    <div class="de-feature">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Weltweit verfuegbar</span>
    </div>
    <div class="de-feature">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Sofortiger Download</span>
    </div>
    <div class="de-feature">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Immer aktuell</span>
    </div>
  </div>

  <div class="de-content">
    <div class="de-content__card">
      <div data-portal="country-select"></div>
      <div class="de-content__submit">
        <div data-portal="submit-button"></div>
      </div>
    </div>
  </div>

  <footer class="de-footer">
    &copy; 2026 Ihr Firmenname &middot;
    <a href="#">Impressum</a> &middot;
    <a href="#">Datenschutz</a>
  </footer>

  <script src="../dist/portal-embed.umd.js"></script>
  <script>
    PortalEmbed.init({ api: '__API_URL__', slug: '__SLUG__' })
  </script>

</body>
</html>
