<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produktdokumentation</title>
  <style>
    /* ===========================================================
     * Product Docs Portal — Beispiel-Vorlage
     * =========================================================== */
    :root {
      --pe-primary: #0891b2;
      --pe-primary-text: #fff;
      --pe-dark: #0c4a6e;
      --pe-surface: #f0f9ff;
      --pe-border: #bae6fd;
      --pe-radius: 12px;
      --pe-font: system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--pe-font);
      background: #fff;
      color: var(--pe-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .pdoc-header {
      background: var(--pe-dark);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pdoc-header__logo {
      font-size: 1.125rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pdoc-header__icon {
      width: 36px; height: 36px;
      background: var(--pe-primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .pdoc-header__icon svg {
      width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2;
    }

    .pdoc-hero {
      background: linear-gradient(135deg, var(--pe-surface) 0%, #fff 100%);
      border-bottom: 1px solid var(--pe-border);
    }
    .pdoc-hero__inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 480px;
    }
    .pdoc-hero__brand {
      padding: 48px 48px 48px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid var(--pe-border);
    }
    .pdoc-hero__select {
      padding: 48px 32px 48px 48px;
      display: flex;
      flex-direction: column;
    }

    .pdoc-features {
      background: linear-gradient(to right, var(--pe-surface), #fff);
      border-bottom: 1px solid var(--pe-border);
      padding: 20px 32px;
    }
    .pdoc-features__inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .pdoc-features__badges {
      display: flex;
      gap: 24px;
      flex: 1;
      justify-content: center;
    }
    .pdoc-features__item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--pe-dark);
    }
    .pdoc-features__item svg {
      width: 18px; height: 18px; fill: none; stroke: var(--pe-primary);
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .pdoc-features__submit {
      flex-shrink: 0;
      max-width: 300px;
    }

    .pdoc-footer {
      background: var(--pe-dark);
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 16px 24px;
      font-size: 0.8125rem;
      margin-top: auto;
    }
    .pdoc-footer a { color: rgba(255,255,255,0.8); text-decoration: none; }

    @media (max-width: 1024px) {
      .pdoc-hero__inner { grid-template-columns: 1fr; min-height: auto; }
      .pdoc-hero__brand { border-right: none; border-bottom: 1px solid var(--pe-border); padding: 32px 24px; }
      .pdoc-hero__select { padding: 32px 24px; }
    }
    @media (max-width: 768px) {
      .pdoc-features__inner { flex-direction: column; }
      .pdoc-features__submit { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>

  <header class="pdoc-header">
    <a href="#" class="pdoc-header__logo">
      <div class="pdoc-header__icon">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span>Produktdokumentation</span>
    </a>
  </header>

  <section class="pdoc-hero">
    <div class="pdoc-hero__inner">
      <div class="pdoc-hero__brand">
        <div data-portal="branding"></div>
      </div>
      <div class="pdoc-hero__select">
        <div data-portal="country-select"></div>
      </div>
    </div>
  </section>

  <div class="pdoc-features">
    <div class="pdoc-features__inner">
      <div class="pdoc-features__badges">
        <div class="pdoc-features__item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Mehrsprachig</span>
        </div>
        <div class="pdoc-features__item">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>PDF-Download</span>
        </div>
        <div class="pdoc-features__item">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Sicherheitsinfos</span>
        </div>
      </div>
      <div class="pdoc-features__submit">
        <div data-portal="submit-button"></div>
      </div>
    </div>
  </div>

  <footer class="pdoc-footer">
    &copy; 2026 Ihr Firmenname |
    <a href="#">Impressum</a> |
    <a href="#">Datenschutz</a>
  </footer>

  <script src="../dist/portal-embed.umd.js"></script>
  <script>
    PortalEmbed.init({
      api: 'http://localhost:8000/api/v1',
      slug: '__SLUG__',
      catalogUrl: '/catalog-embed',
    })
  </script>

</body>
</html>
