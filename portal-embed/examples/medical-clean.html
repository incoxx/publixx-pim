<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal — Medical Clean</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===========================================================
     * MEDICAL CLEAN — Minimalistisches Medizintechnik-Portal
     * ===========================================================
     * Farbschema: Weiss/Grau mit Teal-Akzent
     * Inspiriert von: Medizinprodukt-Dokumentationsportalen
     */
    :root {
      --pe-primary: #0d9488;
      --pe-primary-text: #fff;
      --pe-dark: #1e293b;
      --pe-surface: #f8fafc;
      --pe-border: #e2e8f0;
      --pe-radius: 8px;
      --pe-font: 'Inter', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--pe-font); color: var(--pe-dark); background: #fff; }

    .mc-header {
      background: #fff;
      border-bottom: 1px solid var(--pe-border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mc-header__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--pe-dark);
      text-decoration: none;
    }
    .mc-header__logo-mark {
      width: 32px; height: 32px;
      background: var(--pe-primary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .mc-header__logo-mark svg {
      width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2;
    }
    .mc-header__nav {
      display: flex; gap: 24px; font-size: 0.875rem; color: #64748b;
    }
    .mc-header__nav a { color: inherit; text-decoration: none; }
    .mc-header__nav a:hover { color: var(--pe-primary); }

    .mc-hero {
      text-align: center;
      padding: 64px 32px 48px;
      background: var(--pe-surface);
      border-bottom: 1px solid var(--pe-border);
    }
    .mc-hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #ccfbf1;
      color: #0d9488;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .mc-hero [data-portal="branding"] { max-width: 600px; margin: 0 auto; }

    .mc-content {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 32px;
    }

    .mc-features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 700px;
      margin: 40px auto 0;
    }
    .mc-feature {
      text-align: center;
      padding: 20px;
      border-radius: var(--pe-radius);
    }
    .mc-feature__icon {
      width: 40px; height: 40px;
      margin: 0 auto 10px;
      background: #f0fdfa;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .mc-feature__icon svg {
      width: 20px; height: 20px; stroke: var(--pe-primary);
      fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .mc-feature__label { font-size: 0.8125rem; font-weight: 500; color: #475569; }

    .mc-footer {
      border-top: 1px solid var(--pe-border);
      padding: 24px 32px;
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .mc-footer a { color: #64748b; text-decoration: none; }

    @media (max-width: 640px) {
      .mc-hero { padding: 40px 16px 32px; }
      .mc-content { padding: 32px 16px; }
      .mc-features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="mc-header">
    <a href="#" class="mc-header__logo">
      <div class="mc-header__logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke-linejoin="round"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span>Ihr Firmenname</span>
    </a>
    <nav class="mc-header__nav">
      <a href="#">Hilfe</a>
      <a href="#">Kontakt</a>
    </nav>
  </header>

  <section class="mc-hero">
    <div class="mc-hero__badge">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Digitale Produktdokumentation
    </div>
    <div data-portal="branding"></div>

    <div class="mc-features">
      <div class="mc-feature">
        <div class="mc-feature__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
        <div class="mc-feature__label">Mehrsprachig</div>
      </div>
      <div class="mc-feature">
        <div class="mc-feature__icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
        <div class="mc-feature__label">PDF-Download</div>
      </div>
      <div class="mc-feature">
        <div class="mc-feature__icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div class="mc-feature__label">Sicherheitsinfos</div>
      </div>
    </div>
  </section>

  <div class="mc-content">
    <div data-portal="country-select"></div>
    <div style="margin-top: 24px;">
      <div data-portal="submit-button"></div>
    </div>
  </div>

  <footer class="mc-footer">
    &copy; 2026 Ihr Firmenname &middot;
    <a href="#">Impressum</a> &middot;
    <a href="#">Datenschutz</a>
  </footer>

  <script src="../dist/portal-embed.umd.js"></script>
  <script>
    PortalEmbed.init({ api: '__API_URL__', slug: '__SLUG__' })
  </script>

</body>
</html>
