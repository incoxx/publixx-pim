name: Tests

on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Prepare Laravel bootstrap cache
        run: mkdir -p bootstrap/cache && chmod 775 bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Unit tests
        run: vendor/bin/phpunit --testsuite=Unit

      - name: Run Feature tests
        run: vendor/bin/phpunit --testsuite=Feature

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pim-frontend/package-lock.json

      - name: Install dependencies
        run: cd pim-frontend && npm ci

      - name: Run tests
        run: cd pim-frontend && npm run test:run

      - name: Lint
        run: cd pim-frontend && npm run lint

  code-style:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Prepare Laravel bootstrap cache
        run: mkdir -p bootstrap/cache && chmod 775 bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel Pint
        run: vendor/bin/pint --test
