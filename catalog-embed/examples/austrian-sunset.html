<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Austrian Sunset – Produktkatalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===========================================================
     * AUSTRIAN SUNSET — Full-Width Corporate Template
     * ===========================================================
     * Inspiriert von Doka DOPI Layout
     * Farbschema: Blau #004588, Gelb #fd0
     * Font:   Open Sans
     * Layout: Volle Breite, Sidebar links, Content rechts
     */
    :root {
      --pxc-primary: #004588;
      --pxc-primary-text: #ffffff;
      --pxc-accent: #fd0;
      --pxc-bg: #ffffff;
      --pxc-surface: #f7f7f7;
      --pxc-border: #e0e0e0;
      --pxc-text: #2b2b2b;
      --pxc-text-muted: #808080;
      --pxc-radius: 0px;
      --pxc-font: 'Open Sans', sans-serif;
      --pxc-shadow: none;
      --pxc-shadow-lg: 0 2px 8px rgba(0,0,0,0.15);

      --aset-blue: #004588;
      --aset-blue-hover: #003570;
      --aset-yellow: #fd0;
      --aset-dark: #2b2b2b;
      --aset-gray-bg: #f5f5f5;
      --aset-border: #e0e0e0;
      --aset-sidebar-w: 300px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--pxc-font);
      font-size: 15px;
      font-weight: 400;
      background: #fff;
      color: var(--aset-dark);
    }

    /* ===== HEADER — Yellow bar, full width ===== */
    .aset-header {
      background: var(--aset-yellow);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .aset-header__inner {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 56px;
      gap: 24px;
    }

    /* Logo */
    .aset-logo {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .aset-logo__icon {
      width: 44px;
      height: 44px;
      background: var(--aset-blue);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aset-logo__icon svg {
      width: 28px;
      height: 28px;
      fill: var(--aset-yellow);
    }
    .aset-logo__text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--aset-blue);
      letter-spacing: -0.5px;
    }

    /* Header title */
    .aset-header__title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--aset-blue);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Header right area: locale, search, wishlist */
    .aset-header__actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .aset-header__actions .pxc-locale__btn {
      border: none;
      background: transparent;
      color: var(--aset-blue);
      font-weight: 600;
      font-size: 14px;
      padding: 4px 6px;
    }
    .aset-header__actions .pxc-locale__btn--active {
      background: var(--aset-blue);
      color: #fff;
    }

    /* Header icon buttons */
    .aset-header__icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--aset-blue);
      border-radius: 50%;
      transition: background 0.15s;
    }
    .aset-header__icon-btn:hover {
      background: rgba(0,69,136,0.1);
    }
    .aset-header__icon-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Wishlist override in header */
    .aset-header__actions .pxc-wishlist-btn {
      background: transparent;
      border: none;
      color: var(--aset-blue);
      padding: 6px;
      font-size: 14px;
      gap: 4px;
    }
    .aset-header__actions .pxc-wishlist-btn:hover {
      background: rgba(0,69,136,0.1);
      border-radius: 50%;
    }
    .aset-header__actions .pxc-wishlist-btn__badge {
      background: var(--aset-blue);
      color: var(--aset-yellow);
    }

    /* User avatar */
    .aset-header__avatar {
      width: 36px;
      height: 36px;
      background: var(--aset-blue);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ===== MAIN LAYOUT — Full width, sidebar + content ===== */
    .aset-page {
      display: flex;
      min-height: calc(100vh - 56px - 40px);
    }

    /* ===== SIDEBAR ===== */
    .aset-sidebar {
      width: var(--aset-sidebar-w);
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--aset-border);
      overflow-y: auto;
      padding: 8px 0;
    }

    /* Category tree styling */
    .aset-sidebar .pxc-categories {
      padding: 4px 0;
    }
    .aset-sidebar .pxc-categories__header {
      display: none;
    }
    .aset-sidebar .pxc-categories__item {
      border-radius: 0;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--aset-blue);
      transition: background 0.15s, color 0.15s;
    }
    .aset-sidebar .pxc-categories__item:hover {
      background: #f0f0f0;
    }
    .aset-sidebar .pxc-categories__item--active {
      background: var(--aset-yellow);
      color: var(--aset-blue);
      font-weight: 700;
      border-left: 4px solid var(--aset-yellow);
    }
    .aset-sidebar .pxc-categories__item--active:hover {
      background: var(--aset-yellow);
    }
    .aset-sidebar .pxc-categories__toggle {
      color: var(--aset-blue);
    }
    .aset-sidebar .pxc-categories__count {
      display: none;
    }

    /* Facets in sidebar */
    .aset-sidebar .pxc-facets__title {
      font-weight: 600;
      color: var(--aset-dark);
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.03em;
    }
    .aset-sidebar .pxc-facets__badge {
      background: var(--aset-blue);
      border-radius: 0;
    }
    .aset-sidebar .pxc-facets__group {
      border-color: var(--aset-border);
    }

    /* ===== CONTENT AREA ===== */
    .aset-content {
      flex: 1;
      min-width: 0;
      padding: 20px 32px 40px;
      background: #fff;
    }

    /* ===== SEARCH BAR + FILTER BUTTON — full width in content area ===== */
    .aset-search-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .aset-search-bar .pxc-search__wrapper {
      border: 1px solid var(--aset-border);
      border-radius: 0;
      background: #fff;
    }
    .aset-search-bar .pxc-search__input {
      border: none;
      border-radius: 0;
      height: 40px;
      font-size: 15px;
      background: transparent;
    }
    .aset-search-bar .pxc-search__input:focus {
      box-shadow: none;
      outline: none;
    }

    /* Filtern button styling */
    .aset-search-bar .pxc-facets-trigger {
      border: 1px solid var(--aset-border);
      border-radius: 0;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: 600;
      color: var(--aset-blue);
      background: #fff;
      height: 42px;
    }
    .aset-search-bar .pxc-facets-trigger:hover {
      border-color: var(--aset-blue);
      background: var(--aset-gray-bg);
    }

    /* Drawer overrides for this template */
    .pxc-facets-drawer {
      border-radius: 0;
    }
    .pxc-facets-drawer__header {
      border-bottom: 1px solid var(--aset-border);
    }
    .pxc-facets-drawer__title {
      color: var(--aset-blue);
      font-size: 1.1rem;
    }
    .pxc-facets-drawer__footer .pxc-btn--outline {
      border: 1px solid var(--aset-border);
      color: var(--aset-dark);
      border-radius: 0;
    }
    .pxc-facets-drawer__footer .pxc-btn--primary {
      background: var(--aset-blue);
      border-radius: 0;
    }

    /* ===== TOOLBAR OVERRIDES ===== */
    .aset-toolbar .pxc-toolbar {
      border-bottom: none;
      padding: 8px 0;
    }

    /* ===== PRODUCT GRID — full width, list-style rows ===== */
    .aset-products .pxc-product-grid__grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .aset-products .pxc-product-card {
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      border-bottom: 1px solid var(--aset-border);
    }
    .aset-products .pxc-product-card:hover {
      box-shadow: none;
      transform: none;
      background: var(--aset-gray-bg);
    }
    .aset-products .pxc-product-card__image {
      background: white;
      border: 1px solid var(--aset-border);
      border-radius: 0;
      aspect-ratio: 1;
    }
    .aset-products .pxc-product-card__name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--aset-blue);
      min-height: auto;
    }
    .aset-products .pxc-product-card__price {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--aset-blue);
      background: transparent;
      padding: 6px 0;
    }
    .aset-products .pxc-product-card__body {
      padding: 8px 0;
    }
    .aset-products .pxc-product-card__category {
      display: none;
    }

    /* List view: table-like rows */
    .aset-products .pxc-product-grid__grid--list .pxc-product-card {
      border: none;
      border-bottom: 1px solid var(--aset-border);
      padding: 8px 0;
    }
    .aset-products .pxc-product-grid__grid--list .pxc-product-card__image {
      width: 80px;
      min-height: 60px;
      border: none;
    }

    /* ===== PAGINATION OVERRIDES ===== */
    .aset-pagination .pxc-pagination__btn {
      border-radius: 0;
    }
    .aset-pagination .pxc-pagination__active {
      background: var(--aset-blue) !important;
    }

    /* ===== PRODUCT DETAIL OVERRIDES ===== */
    .pxc-detail-modal {
      border-radius: 0;
    }
    .pxc-detail__title {
      color: var(--aset-blue);
      font-weight: 700;
      font-size: 1.75rem;
    }
    .pxc-detail__section-title {
      color: var(--aset-blue);
      font-weight: 600;
      text-transform: none;
      font-size: 1rem;
      border-bottom: none;
    }
    .pxc-detail__price-value {
      color: var(--aset-blue);
      font-weight: 600;
    }
    .pxc-detail__tab--active {
      color: var(--aset-blue);
      border-bottom-color: var(--aset-blue);
    }

    /* ===== BUTTON OVERRIDES ===== */
    .pxc-btn {
      border-radius: 0;
    }
    .pxc-btn--primary {
      background: var(--aset-blue);
      color: #fff;
      border: none;
    }
    .pxc-btn--primary:hover {
      background: var(--aset-blue-hover);
    }

    /* ===== FOOTER ===== */
    .aset-footer {
      background: var(--aset-gray-bg);
      border-top: 1px solid var(--aset-border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--aset-dark);
      min-height: 40px;
    }
    .aset-footer a {
      color: var(--aset-dark);
      text-decoration: none;
      margin: 0 6px;
    }
    .aset-footer a:hover {
      text-decoration: underline;
    }
    .aset-footer__left {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .aset-footer__right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--pxc-text-muted);
      font-size: 12px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 767px) {
      .aset-page {
        flex-direction: column;
      }
      .aset-sidebar {
        /* Mobile: hidden by default, pxc-sidebar class (added by JS)
           transforms it into a fixed left drawer via !important rules */
        display: none;
      }
      .aset-content {
        padding: 16px;
      }
      .aset-header__inner {
        padding: 0 12px;
        gap: 12px;
      }
      .aset-header__title {
        font-size: 0.9rem;
      }
      /* Hide long title on small screens to make room for hamburger + actions */
      @media (max-width: 480px) {
        .aset-header__title {
          display: none;
        }
      }
      .aset-footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
        padding: 12px;
      }
      /* Hamburger button color in yellow header */
      .pxc-sidebar-toggle {
        color: var(--aset-blue);
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER — Yellow bar with Logo, Title, Actions ===== -->
  <header class="aset-header">
    <div class="aset-header__inner">
      <div data-catalog="sidebar-toggle"></div>
      <div class="aset-logo">
        <div class="aset-logo__icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
        </div>
        <span class="aset-logo__text">Ihr Logo</span>
      </div>

      <span class="aset-header__title">Dokumentation &amp; Produktinformation</span>

      <div class="aset-header__actions">
        <div data-catalog="locale"></div>
        <div data-catalog="wishlist-button"></div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="aset-page">
    <!-- Sidebar: Categories only -->
    <aside class="aset-sidebar" data-catalog-sidebar>
      <div data-catalog="categories"></div>
    </aside>

    <!-- Content area -->
    <main class="aset-content">
      <!-- Search bar + Filter button -->
      <div class="aset-search-bar">
        <div data-catalog="search" style="flex:1"></div>
        <div data-catalog="facets" data-mode="drawer"></div>
      </div>

      <!-- Toolbar: count, sort, view toggle -->
      <div class="aset-toolbar">
        <div data-catalog="toolbar"></div>
      </div>
      <div data-catalog="active-filters"></div>

      <!-- Product grid -->
      <div class="aset-products">
        <div data-catalog="product-grid"></div>
      </div>

      <!-- Pagination -->
      <div class="aset-pagination">
        <div data-catalog="pagination"></div>
      </div>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="aset-footer">
    <div class="aset-footer__left">
      <a href="#">Support</a> |
      <a href="#">Kontakt</a> |
      <a href="#">Impressum</a>
    </div>
    <div class="aset-footer__right">
      Powered by PublixxCatalog &nbsp;|&nbsp; Copyright &copy; 2026 Ihre Firma GmbH
    </div>
  </footer>

  <!-- Hidden widgets (Modals/Drawers) -->
  <div data-catalog="wishlist"></div>
  <div data-catalog="product-detail"></div>
  <div data-catalog="compare"></div>

  <!-- ===== INIT ===== -->
  <script src="../dist/catalog-embed.umd.js"></script>
  <script>
    PublixxCatalog.init({
      api: 'http://localhost:8000/api/v1',
      locale: 'de',
      perPage: 20,
    })
  </script>

</body>
</html>
