# anyPIM Video Story: APIs, API Designer & MCP
# Erklärt den API Designer konzeptuell und demonstriert den MCP Playground interaktiv

meta:
  id: "12-api-mcp"
  title: "APIs, API Designer & MCP"
  description: "anyPIM als Datenprovider: JSON- und GraphQL-Streams per API Designer konfigurieren, als REST-Endpunkt bereitstellen – und über das MCP-Protokoll für KI-Agenten wie Claude zugänglich machen."
  version: "1.1.0"
  duration_estimate: 110
  tags:
    - api
    - graphql
    - json
    - mcp
    - api-designer
    - ki
  voice:
    lang: "de"
    gender: "female"
    provider: "elevenlabs"
    voice_id: ""
  viewport:
    width: 1920
    height: 1080
  slow_mo: 350
  seeder: "DemoVideoSeeder"

steps:
  # --- Login ---
  - id: "open-login"
    action: navigate
    target: "/login"
    wait_for: "[data-testid='login-form']"
    sprecher: "anyPIM ist nicht nur eine Datenpflegeplattform – es ist auch ein Datenprovider. Heute zeigen wir, wie PIM-Daten über APIs und das MCP-Protokoll für externe Systeme und KI-Agenten zugänglich werden."
    pause_after: 2000

  - id: "fill-email"
    action: fill
    selector: "[data-testid='input-email']"
    value: "${VIDEO_DEMO_USER_EMAIL}"
    type_speed: 60
    sprecher: ""

  - id: "fill-password"
    action: fill
    selector: "[data-testid='input-password']"
    value: "${VIDEO_DEMO_USER_PASSWORD}"
    type_speed: 60
    sprecher: ""

  - id: "submit-login"
    action: click
    selector: "[data-testid='btn-login']"
    wait_for: "[data-testid='product-list']"
    wait_timeout: 8000
    sprecher: "Los geht's."
    pause_after: 1000

  # ── 1. API DESIGNER – KONZEPT (ohne Navigation) ──────────────────────────────
  - id: "explain-api-designer"
    action: wait
    duration: 1500
    sprecher: "anyPIM bietet zwei Wege, Daten nach außen zu geben. Erstens: der API Designer. Hier werden JSON- oder GraphQL-Datenstrom-Templates konfiguriert. Jedes Template bekommt einen Slug und ist sofort unter einer stabilen URL erreichbar – ohne Deployment, ohne Code."
    pause_after: 4000

  - id: "explain-api-streams"
    action: wait
    duration: 1000
    sprecher: "Shops, Portale, Marktplätze und interne Tools können so jederzeit frische PIM-Daten abrufen. Mit Delta-Sync: externe Systeme holen nur die Änderungen seit dem letzten Abruf. JSON-Templates für flache Strukturen, GraphQL für flexible Abfragen mit typisiertem Schema."
    pause_after: 4000

  # ── 2. MCP PLAYGROUND ────────────────────────────────────────────────────────
  - id: "open-mcp-playground"
    action: navigate
    target: "/mcp-playground"
    wait_for: ".grid.grid-cols-1.gap-1"
    wait_timeout: 8000
    sprecher: "Zweitens: das MCP-Protokoll. MCP ist ein offener Standard, der es KI-Agenten wie Claude ermöglicht, direkt mit anyPIM zu arbeiten – Produkte suchen, Hierarchien abfragen, Attributwerte lesen und ändern – alles über strukturierte Tool-Aufrufe."
    pause_after: 3000

  - id: "highlight-use-cases"
    action: highlight
    selector: ".space-y-4.max-w-5xl > div:nth-child(2)"
    sprecher: "Der MCP Playground zeigt typische Anwendungsfälle: Datenschema abrufen, Datenqualität prüfen, Produkte analysieren, Hierarchiestruktur erkunden. Vorgefertigte Beispiele machen den Einstieg leicht."
    pause_after: 4000

  - id: "highlight-tool-list"
    action: highlight
    selector: ".grid.grid-cols-1.gap-1"
    sprecher: "Zwölf MCP-Tools stehen bereit: Produkte streamen, GraphQL-Queries ausführen, Attribute lesen, Hierarchien abfragen, und Attributwerte direkt setzen. KI-Assistenten wie Claude nutzen exakt diese Tools, wenn sie auf anyPIM-Daten zugreifen."
    pause_after: 4500

  - id: "highlight-run-button"
    action: highlight
    selector: "button.pim-btn.pim-btn-primary.w-full"
    sprecher: "Tool auswählen, Parameter setzen, ausführen – die Antwort kommt direkt aus dem PIM-System als reines JSON, genau so wie der KI-Agent sie empfangen würde."
    pause_after: 3500

  - id: "scroll-to-mcp-config"
    action: scroll
    direction: down
    sprecher: "Am Ende der Seite: die fertige MCP-Konfiguration für Claude Code und Claude Desktop. Einmal in die mcp.json eingetragen – und Claude hat direkten Zugriff auf alle PIM-Daten, Hierarchien und Attribute."
    pause_after: 4000

  - id: "scroll-back-up"
    action: scroll
    direction: up
    sprecher: ""
    pause_after: 800

  # ── ZUSAMMENFASSUNG ──────────────────────────────────────────────────────────
  - id: "end"
    action: wait
    duration: 2000
    sprecher: "anyPIM als Datenprovider: JSON- und GraphQL-Streams per API Designer konfiguriert, unter stabilen URLs bereitgestellt – für Shops, Portale und alle externen Systeme. Und über MCP direkt zugänglich für KI-Agenten. anyPIM – offen, vernetzt, KI-ready."
