# anyPIM Video Story: Preview & Asset-Vorschau konfigurieren
# Zeigt die Katalog-Einstellungen und die öffentlichen Routes /preview & /assetpreview

meta:
  id: "06-preview-konfiguration"
  title: "Preview & Asset-Vorschau"
  description: "Katalog-Konfiguration in den Einstellungen — dann live in /preview und /assetpreview."
  version: "1.0.0"
  duration_estimate: 80
  tags:
    - katalog
    - preview
    - konfiguration
  voice:
    lang: "de"
    gender: "female"
    provider: "elevenlabs"
    voice_id: ""
  viewport:
    width: 1920
    height: 1080
  slow_mo: 400
  seeder: "DemoVideoSeeder"

steps:
  # --- Login ---
  - id: "open-login"
    action: navigate
    target: "/login"
    wait_for: "[data-testid='login-form']"
    sprecher: "Willkommen bei anyPIM. Heute zeigen wir die Katalog-Vorschau – und wie man sie konfiguriert."
    pause_after: 1500

  - id: "fill-email"
    action: fill
    selector: "[data-testid='input-email']"
    value: "${VIDEO_DEMO_USER_EMAIL}"
    type_speed: 60
    sprecher: ""

  - id: "fill-password"
    action: fill
    selector: "[data-testid='input-password']"
    value: "${VIDEO_DEMO_USER_PASSWORD}"
    type_speed: 60
    sprecher: ""

  - id: "submit-login"
    action: click
    selector: "[data-testid='btn-login']"
    wait_for: "[data-testid='product-list']"
    wait_timeout: 8000
    sprecher: "Eingeloggt – wir wechseln direkt in die Einstellungen."
    pause_after: 1500

  # --- Einstellungen öffnen ---
  - id: "open-settings"
    action: navigate
    target: "/settings"
    wait_for: ".max-w-5xl"
    wait_timeout: 8000
    sprecher: "Die Einstellungen sind die Schaltzentrale von anyPIM. Hier verwalten wir alles – von Erscheinungsbild bis zur Katalog-Konfiguration."
    pause_after: 2000

  - id: "highlight-settings-panel"
    action: highlight
    selector: ".max-w-5xl"
    sprecher: ""
    pause_after: 800

  # --- Katalog-Tab: Konfiguration zeigen ---
  - id: "click-tab-katalog"
    action: click
    selector: "button:has-text('Katalog')"
    sprecher: "Der Katalog-Tab enthält alle Einstellungen für die öffentliche Produktvorschau – Hierarchie, Design, Facetten, Layouts."
    pause_after: 2500

  - id: "scroll-config-down"
    action: scroll
    direction: down
    sprecher: "Wir sehen hier: welche Hierarchie angezeigt wird, welche Attribute sichtbar sind und wie das Layout aussieht."
    pause_after: 2500

  - id: "scroll-config-more"
    action: scroll
    direction: down
    sprecher: ""
    pause_after: 1500

  - id: "scroll-config-up"
    action: scroll
    direction: up
    sprecher: ""
    pause_after: 800

  # --- /preview öffnen ---
  - id: "open-preview"
    action: navigate
    target: "/preview"
    wait_for: "[data-theme='pim-catalog']"
    wait_timeout: 10000
    sprecher: "Unter der Route /preview ist der öffentliche Produktkatalog erreichbar – ohne Login. Perfekt für Kunden, Händler oder Showrooms."
    pause_after: 2500

  - id: "highlight-catalog-layout"
    action: highlight
    selector: "[data-theme='pim-catalog']"
    sprecher: "Der Katalog zeigt Produkte mit Suchfunktion, Facetten und Kategorie-Navigation – vollständig über die Einstellungen steuerbar."
    pause_after: 3000

  - id: "scroll-catalog-down"
    action: scroll
    direction: down
    sprecher: ""
    pause_after: 1500

  # --- /assetpreview (Bonus) ---
  - id: "open-assetpreview"
    action: navigate
    target: "/assetpreview"
    wait_for: "[data-theme='pim-catalog']"
    wait_timeout: 10000
    sprecher: "Bonus: /assetpreview ist die öffentliche Medien-Bibliothek. Bilder, Dokumente und PDFs – durchsuchbar, ohne Admin-Zugang."
    pause_after: 2500

  - id: "highlight-asset-catalog"
    action: highlight
    selector: "[data-theme='pim-catalog']"
    sprecher: "Beide Vorschau-Routes sind vollständig eigenständig – und lassen sich per Einstellung aktivieren, gestalten und einschränken."
    pause_after: 3000

  - id: "end"
    action: wait
    duration: 2000
    sprecher: "anyPIM – eine Plattform für Datenpflege, Katalogisierung und die Bereitstellung für alle Kanäle."
