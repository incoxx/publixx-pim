# anyPIM Video Story: PQL-Suche
# Zeigt die Suchfunktionen inkl. Freitext und Attribut-Filter

meta:
  id: "03-pql-suche"
  title: "Produkte suchen mit PQL"
  description: "Zeigt die Suchfunktionen in anyPIM – Freitextsuche, Attributfilter und Ergebnisnavigation."
  version: "1.0.0"
  duration_estimate: 70
  tags:
    - grundlagen
    - suche
  voice:
    lang: "de"
    gender: "female"
    provider: "elevenlabs"
    voice_id: ""
  viewport:
    width: 1920
    height: 1080
  slow_mo: 600
  seeder: "DemoVideoSeeder"
  seeder_reset: true

steps:
  # --- Login ---
  - id: "open-login"
    action: navigate
    target: "/login"
    wait_for: "[data-testid='login-form']"
    sprecher: "In diesem Video zeigen wir die Suchfunktionen von anyPIM."
    pause_after: 1000

  - id: "fill-email"
    action: fill
    selector: "[data-testid='input-email']"
    value: "${VIDEO_DEMO_USER_EMAIL}"
    type_speed: 60
    sprecher: ""

  - id: "fill-password"
    action: fill
    selector: "[data-testid='input-password']"
    value: "${VIDEO_DEMO_USER_PASSWORD}"
    type_speed: 60
    sprecher: ""

  - id: "submit-login"
    action: click
    selector: "[data-testid='btn-login']"
    wait_for: "[data-testid='product-list']"
    wait_timeout: 5000
    sprecher: ""
    pause_after: 1000

  # --- Navigation zur Suche ---
  - id: "click-search"
    action: click
    selector: "[data-testid='nav-search']"
    wait_for: "[data-testid='search-view']"
    wait_timeout: 5000
    sprecher: "Die Suchfunktion erreichen wir über die Navigation – oder mit dem Shortcut Ctrl+Shift+F."
    pause_after: 1500

  - id: "show-search"
    action: highlight
    selector: "[data-testid='search-view']"
    sprecher: "Die Suche unterstützt Freitext, Attributfilter, reguläre Ausdrücke und sogar phonetische Suche."
    pause_after: 2000

  # --- Freitextsuche ---
  - id: "search-text"
    action: fill
    selector: "[data-testid='search-input']"
    value: "Akkubohr"
    type_speed: 100
    sprecher: "Wir suchen nach Akkubohrern – die Eingabe durchsucht Produktnamen, SKU und Attribute gleichzeitig."
    pause_after: 1000

  - id: "submit-search"
    action: click
    selector: "[data-testid='search-input']"
    sprecher: ""
    pause_after: 500

  - id: "press-enter"
    action: fill
    selector: "[data-testid='search-input']"
    value: "Akkubohr"
    sprecher: ""
    pause_after: 500

  - id: "wait-results"
    action: wait
    duration: 2000
    sprecher: "Die Ergebnisse erscheinen sofort – mit Produktdetails und Relevanz-Sortierung."

  - id: "show-results"
    action: assert_visible
    selector: "[data-testid='search-results']"
    sprecher: ""
    pause_after: 2000

  - id: "highlight-results"
    action: highlight
    selector: "[data-testid='search-results']"
    sprecher: "Gefundene Produkte können direkt geöffnet, verglichen oder in die Merkliste aufgenommen werden."
    pause_after: 2500

  - id: "end"
    action: wait
    duration: 2000
    sprecher: "Die Suche in anyPIM – schnell, flexibel und präzise."
