# anyPIM Video Story – Vorlage
# Kopiere dieses Verzeichnis und passe die Werte an.

meta:
  id: "meine-story"                    # Muss dem Verzeichnisnamen entsprechen
  title: "Story-Titel"
  description: "Kurze Beschreibung der Story"
  version: "1.0.0"
  duration_estimate: 60                # Sekunden (Richtwert)
  tags:
    - grundlagen
  voice:
    lang: "de"
    gender: "female"                   # male | female
    provider: "elevenlabs"             # elevenlabs | gtts (Fallback)
    voice_id: ""                       # ElevenLabs Voice ID, leer = Standardstimme
  viewport:
    width: 1920
    height: 1080
  slow_mo: 600                         # ms zwischen Playwright-Aktionen
  seeder: "DemoVideoSeeder"           # Seeder-Klasse vor dem Recording
  seeder_reset: true                   # DB zurücksetzen vor Seeder

steps:
  # --- Login (in fast jeder Story gleich) ---
  - id: "login"
    action: navigate
    target: "/login"
    wait_for: "[data-testid='login-form']"
    sprecher: "Willkommen bei anyPIM."
    pause_after: 1000

  - id: "fill-email"
    action: fill
    selector: "[data-testid='input-email']"
    value: "${VIDEO_DEMO_USER_EMAIL}"
    sprecher: ""

  - id: "fill-password"
    action: fill
    selector: "[data-testid='input-password']"
    value: "${VIDEO_DEMO_USER_PASSWORD}"
    sprecher: ""

  - id: "submit-login"
    action: click
    selector: "[data-testid='btn-login']"
    wait_for: "[data-testid='product-list']"
    wait_timeout: 5000
    sprecher: "Nach dem Login sehen wir die Produktübersicht."
    pause_after: 1500

  # --- Hier eigene Steps einfügen ---

  - id: "beispiel-klick"
    action: click
    selector: "[data-testid='btn-new-product']"
    wait_for: "[data-testid='product-create-panel']"
    sprecher: "Beispiel: Neues Produkt anlegen."
    pause_after: 1000
