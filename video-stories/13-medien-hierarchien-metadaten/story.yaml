# anyPIM Video Story: Medien — Hierarchien, Attribute & Produktverknüpfung
# Zeigt die Medienverwaltung (/media), die Ordner-Hierarchie der Mediendatenbank,
# die interne Medien-Vorschau (/assetpreview), Attribute (Metadaten) an Medien
# sowie das neue Feature: Assets per Metadaten-Attribut direkt mit einem Produkt
# oder einem Hierarchie-Knoten verlinken.

meta:
  id: "13-medien-hierarchien-metadaten"
  title: "Medien: Hierarchien, Attribute & Produktverknüpfung"
  description: "Wie Medien in anyPIM organisiert sind (Ordner-Hierarchie), wie die interne Medien-Vorschau /assetpreview funktioniert, welche Metadaten (Attribute) ein Medium tragen kann — und wie Assets per Attribut direkt mit einem Produkt oder einer Kategorie verknüpft werden."
  version: "1.0.0"
  duration_estimate: 155
  tags:
    - medien
    - hierarchien
    - assetpreview
    - attribute
    - metadaten
    - relationen
  voice:
    lang: "de"
    gender: "female"
    provider: "elevenlabs"
    voice_id: ""
  viewport:
    width: 1920
    height: 1080
  slow_mo: 400
  seeder: "DemoVideoSeeder"
  seeder_reset: true

steps:
  # --- Login ---
  - id: "open-login"
    action: navigate
    target: "/login"
    wait_for: "[data-testid='login-form']"
    sprecher: "anyPIM verwaltet nicht nur Produktdaten, sondern auch alle Medien dazu. Heute zeigen wir, wie Medien organisiert sind, welche Metadaten sie tragen können — und wie sich Bilder per Attribut direkt mit Produkten verknüpfen lassen."
    pause_after: 2000

  - id: "fill-email"
    action: fill
    selector: "[data-testid='input-email']"
    value: "${VIDEO_DEMO_USER_EMAIL}"
    type_speed: 60
    sprecher: ""

  - id: "fill-password"
    action: fill
    selector: "[data-testid='input-password']"
    value: "${VIDEO_DEMO_USER_PASSWORD}"
    type_speed: 60
    sprecher: ""

  - id: "submit-login"
    action: click
    selector: "[data-testid='btn-login']"
    wait_for: "[data-testid='product-list']"
    wait_timeout: 8000
    sprecher: "Login – und weiter zur Medienverwaltung."
    pause_after: 1000

  # ── 1. MEDIENVERWALTUNG ÖFFNEN ───────────────────────────────────────────────
  - id: "open-media"
    action: navigate
    target: "/media"
    wait_for: "[data-testid='media-view']"
    wait_timeout: 8000
    sprecher: "Das ist die Medienverwaltung. Alle Bilder, PDFs und Videos an einem Ort – mit Suche, Filtern und Massenbearbeitung."
    pause_after: 2500

  # ── 2. MEDIEN-HIERARCHIE (ORDNERSTRUKTUR) ────────────────────────────────────
  - id: "highlight-folder-tree"
    action: highlight
    selector: "[data-testid='media-folder-sidebar']"
    sprecher: "Links steht der Ordnerbaum. Medien sind – genau wie Produkte – in einer eigenen Hierarchie organisiert. Ordner und Unterordner lassen sich frei anlegen, und jeder Ordner kann eigene Attribut-Zuordnungen bekommen."
    pause_after: 3500

  - id: "click-folder-produktbilder"
    action: click
    selector: "text=Produktbilder"
    wait_timeout: 5000
    sprecher: "Ein Klick auf 'Produktbilder' filtert die Ansicht auf diesen Ordner."
    pause_after: 2000

  # ── 3. MEDIUM ÖFFNEN ──────────────────────────────────────────────────────────
  - id: "open-media-detail"
    action: click
    selector: ".pim-card.cursor-pointer"
    wait_for: "[data-testid='media-detail-panel']"
    wait_timeout: 8000
    sprecher: "Ein Klick auf ein Bild öffnet die Detailansicht rechts – mit Vorschau, Verwendungsnachweis und allen Metadaten."
    pause_after: 2000

  # ── 4. ATTRIBUTE (METADATEN) ──────────────────────────────────────────────────
  - id: "scroll-to-attributes"
    action: scroll
    selector: "[data-testid='media-detail-attributes']"
    sprecher: ""
    pause_after: 800

  - id: "highlight-attributes"
    action: highlight
    selector: "[data-testid='media-detail-attributes']"
    sprecher: "Jedes Medium kann eigene Attribute tragen – genau wie ein Produkt. Diese Metadaten kommen aus der Ordner-Hierarchie und lassen sich hier direkt am Bild pflegen."
    pause_after: 3000

  # ── 5. NEUES FEATURE: RELATIONEN ÜBER ATTRIBUTE ──────────────────────────────
  - id: "highlight-linked-product"
    action: highlight
    selector: "[data-testid='field-media-linked-product-ref']"
    sprecher: "Und das ist neu: ein Attribut vom Typ 'Produkt-Referenz'. Damit wird dieses Bild direkt mit einem Produkt verknüpft – zusätzlich zur klassischen Bild-Zuordnung über Verwendungstypen."
    pause_after: 3500

  - id: "click-change-product-ref"
    action: click
    selector: "[data-testid='field-media-linked-product-ref'] button:has-text('Ändern')"
    wait_timeout: 5000
    sprecher: "Über 'Ändern' lässt sich die Verknüpfung jederzeit anpassen – mit Live-Suche nach SKU oder Produktname."
    pause_after: 2500

  - id: "highlight-linked-category"
    action: highlight
    selector: "[data-testid='field-media-linked-category-ref']"
    sprecher: "Das gleiche Prinzip funktioniert auch für Kategorien: eine 'Hierarchie-Referenz' verlinkt das Medium mit einem Knoten im Produktbaum. So lassen sich Assets rein über Metadaten mit Produkten und Hierarchien verbinden – ganz ohne manuelle Zuordnung in jedem einzelnen Produkt."
    pause_after: 4000

  # ── 6. /ASSETPREVIEW – INTERNE MEDIENDATENBANK ───────────────────────────────
  - id: "open-assetpreview"
    action: navigate
    target: "/assetpreview"
    wait_for: "[data-theme='pim-catalog']"
    wait_timeout: 10000
    sprecher: "Für den schnellen Zugriff ohne PIM-Oberfläche gibt es /assetpreview – die interne Mediendatenbank für alle Mitarbeiter, mit derselben Ordnerstruktur und denselben Metadaten."
    pause_after: 3000

  - id: "highlight-asset-catalog"
    action: highlight
    selector: "[data-theme='pim-catalog']"
    sprecher: "Bilder durchsuchen, nach Verwendungszweck oder Dateityp filtern, direkt herunterladen – und dank der Metadaten-Verknüpfung ist jederzeit klar, zu welchem Produkt und welcher Kategorie ein Bild gehört."
    pause_after: 3500

  # ── ZUSAMMENFASSUNG ───────────────────────────────────────────────────────────
  - id: "end"
    action: wait
    duration: 2000
    sprecher: "Medien in anyPIM: eine eigene Ordner-Hierarchie, frei konfigurierbare Metadaten – und mit Produkt- und Hierarchie-Referenzen jetzt auch direkte Verknüpfungen zwischen Assets, Produkten und Kategorien."
