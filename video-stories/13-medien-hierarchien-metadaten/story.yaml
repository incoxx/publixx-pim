# anyPIM Video Story: Medien — Hierarchien, Attribute & Produktverknüpfung
# Zeigt die Medienverwaltung (/media), die Ordner-Hierarchie der Mediendatenbank,
# die interne Medien-Vorschau (/assetpreview), Attribute (Metadaten) an Medien
# sowie das neue Feature: Assets per Metadaten-Attribut direkt mit einem Produkt
# oder einem Hierarchie-Knoten verlinken.

meta:
  id: "13-medien-hierarchien-metadaten"
  title: "Medien: Hierarchien, Attribute & Produktverknüpfung"
  description: "Wie Medien in anyPIM organisiert sind (Ordner-Hierarchie), wie die interne Medien-Vorschau /assetpreview funktioniert, welche Metadaten (Attribute) ein Medium tragen kann — und wie Assets per Attribut direkt mit einem Produkt oder einer Kategorie verknüpft werden."
  version: "1.0.0"
  duration_estimate: 155
  tags:
    - medien
    - hierarchien
    - assetpreview
    - attribute
    - metadaten
    - relationen
  voice:
    lang: "de"
    gender: "female"
    provider: "elevenlabs"
    voice_id: ""
  viewport:
    width: 1920
    height: 1080
  slow_mo: 400
  seeder: "DemoVideoSeeder"
  seeder_reset: true

steps:
  # --- Login ---
  - id: "open-login"
    action: navigate
    target: "/login"
    wait_for: "[data-testid='login-form']"
    sprecher: "anyPIM verwaltet auch alle Medien dazu. Heute geht's um Ordner, Metadaten – und die neue Produktverknüpfung per Attribut."
    pause_after: 1500

  - id: "fill-email"
    action: fill
    selector: "[data-testid='input-email']"
    value: "${VIDEO_DEMO_USER_EMAIL}"
    type_speed: 60
    sprecher: ""

  - id: "fill-password"
    action: fill
    selector: "[data-testid='input-password']"
    value: "${VIDEO_DEMO_USER_PASSWORD}"
    type_speed: 60
    sprecher: ""

  - id: "submit-login"
    action: click
    selector: "[data-testid='btn-login']"
    wait_for: "[data-testid='product-list']"
    wait_timeout: 8000
    sprecher: "Login – und weiter zur Medienverwaltung."
    pause_after: 1000

  # ── 1. MEDIENVERWALTUNG ÖFFNEN ───────────────────────────────────────────────
  - id: "open-media"
    action: navigate
    target: "/media"
    wait_for: "[data-testid='media-view']"
    wait_timeout: 8000
    sprecher: "Das ist die Medienverwaltung. Alle Bilder, PDFs und Videos an einem Ort."
    pause_after: 1500

  # ── 2. MEDIEN-HIERARCHIE (ORDNERSTRUKTUR) ────────────────────────────────────
  - id: "highlight-folder-tree"
    action: highlight
    selector: "[data-testid='media-folder-sidebar']"
    sprecher: "Links steht der Ordnerbaum. Medien sind – genau wie Produkte – in einer eigenen Hierarchie organisiert."
    pause_after: 2000

  - id: "click-folder-produktbilder"
    action: click
    selector: "text=Produktbilder"
    wait_timeout: 5000
    sprecher: "Ein Klick auf 'Produktbilder' filtert auf diesen Ordner."
    pause_after: 1800

  # ── 3. MEDIUM ÖFFNEN ──────────────────────────────────────────────────────────
  - id: "open-media-detail"
    action: click
    selector: ".pim-card.cursor-pointer"
    wait_for: "[data-testid='media-detail-panel']"
    wait_timeout: 8000
    sprecher: "Ein Klick auf ein Bild öffnet die Detailansicht – mit Vorschau und allen Metadaten."
    pause_after: 1800

  # ── 4. ATTRIBUTE (METADATEN) ──────────────────────────────────────────────────
  - id: "scroll-to-attributes"
    action: scroll
    selector: "[data-testid='media-detail-attributes']"
    sprecher: ""
    pause_after: 800

  - id: "highlight-attributes"
    action: highlight
    selector: "[data-testid='media-detail-attributes']"
    sprecher: "Jedes Medium kann eigene Attribute tragen – genau wie ein Produkt."
    pause_after: 1800

  # ── 5. NEUES FEATURE: RELATIONEN ÜBER ATTRIBUTE ──────────────────────────────
  - id: "highlight-linked-product"
    action: highlight
    selector: "[data-testid='field-media-linked-product-ref']"
    sprecher: "Neu: das Attribut 'Produkt-Referenz' verknüpft dieses Bild direkt mit einem Produkt."
    pause_after: 2000

  - id: "click-change-product-ref"
    action: click
    selector: "[data-testid='field-media-linked-product-ref'] button:has-text('Ändern')"
    wait_timeout: 5000
    sprecher: "Über 'Ändern' lässt sich die Verknüpfung jederzeit anpassen."
    pause_after: 1800

  - id: "highlight-linked-category"
    action: highlight
    selector: "[data-testid='field-media-linked-category-ref']"
    sprecher: "Das gleiche Prinzip gibt es für Kategorien: eine Hierarchie-Referenz."
    pause_after: 1800

  - id: "highlight-linked-category-detail"
    action: highlight
    selector: "[data-testid='media-detail-attributes']"
    sprecher: "So lassen sich Assets rein per Metadaten mit Produkten und Hierarchien verbinden."
    pause_after: 2000

  # ── 6. /ASSETPREVIEW – INTERNE MEDIENDATENBANK ───────────────────────────────
  - id: "open-assetpreview"
    action: navigate
    target: "/assetpreview"
    wait_for: "[data-theme='pim-catalog']"
    wait_timeout: 10000
    sprecher: "Und hier ist /assetpreview – dieselbe Mediendatenbank, ohne PIM-Oberfläche."
    pause_after: 1800

  - id: "highlight-asset-catalog"
    action: highlight
    selector: "[data-theme='pim-catalog']"
    sprecher: "Bilder durchsuchen und filtern – dank der Verknüpfung immer klar, zu welchem Produkt sie gehören."
    pause_after: 2000

  # ── ZUSAMMENFASSUNG ───────────────────────────────────────────────────────────
  - id: "end"
    action: wait
    duration: 2000
    sprecher: "Medien in anyPIM: eigene Ordner, freie Metadaten – und direkte Verknüpfungen zu Produkten und Kategorien."
